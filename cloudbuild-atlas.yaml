substitutions:
  _REGION: us-central1
  _REPOSITORY: skylark
  _SERVICE: atlas
  _IMAGE: atlas
  _CORS_ALLOWED_ORIGINS: https://YOUR_SKYLARK_CLOUD_RUN_URL

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - atlas/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
      - atlas

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=LTA_BUS_ARRIVAL_URL=https://datamall2.mytransport.sg/ltaodataservice/v3/BusArrival,LTA_TRAIN_ALERT_URL=https://datamall2.mytransport.sg/ltaodataservice/GTFSRealTimeTrainServiceAlerts,ROUTING_API_URL=https://www.onemap.gov.sg/api/public/routingsvc/route,CORS_ALLOWED_ORIGINS=${_CORS_ALLOWED_ORIGINS}
      - --set-secrets=LTA_DATAMALL_API=DATAMALL_API_KEY:latest,ONEMAP_API_TOKEN=ONEMAP_API_TOKEN:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
